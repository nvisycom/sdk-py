version: 2
updates:
  # Version updates for Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Europe/Berlin"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "chore"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    rebase-strategy: "auto"
    versioning-strategy: "increase"
    # Group patch and minor updates together to reduce PR noise.
    groups:
      # pytest and its plugins move together; a plugin built against an older
      # pytest fails collection outright rather than degrading.
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Europe/Berlin"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "chore"
      - "dependencies"
    commit-message:
      prefix: "chore(actions)"
    # Group all GitHub Actions updates together to reduce PR noise.
    groups:
      github-actions:
        patterns:
          - "*"
